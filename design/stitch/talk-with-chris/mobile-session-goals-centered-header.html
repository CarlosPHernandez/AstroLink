<style>
        body {
            background-color: #1c1c1c;
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
        }
        
        .progress-dash {
            width: 32px;
            height: 4px;
            transform: skewX(-30deg);
            background-color: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
        }
        
        .progress-dash.filled {
            background-color: #ffffff;
            border-color: #ffffff;
        }

        .custom-input {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            transition: all 0.3s ease;
        }

        .custom-input:focus {
            border-color: #ffffff;
            outline: none;
            box-shadow: 0 0 0 1px #ffffff;
            background: rgba(255,255,255,0.02);
        }

        .custom-input::placeholder {
            color: rgba(255,255,255,0.4);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-body-md antialiased w-full max-w-[780px] mx-auto overflow-x-hidden relative">
<!-- Top Navigation / Header -->
<header class="w-full flex flex-col items-center pt-xl pb-md px-md relative z-10">
<div class="absolute top-md left-md">
<button class="text-on-background opacity-80 hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined">arrow_back</span>
</button>
</div>
<div class="flex flex-col items-center gap-sm">
<div class="w-20 h-20 rounded-full overflow-hidden border-2 border-white/20 mb-2">
<img alt="Chris Sembroski" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCIMkBq8QoBHnvZLvckuMU3JstfFh6Wg3sh23UeK4GyW3hVAqTj7x8Mi1ZxKRMI4sy4yO1vJtmPzQQWh-YFrNCSqFIsyuF6_R3zLfyqBgSGOFZyNSpX0HJIb331CeuEOlgo_Jky9wKZptcfDMEBvcGAmyvvOozxFSl1QgCv5K97DPRvm3GIYUJKWQwbIguSsUXRQNvNyoEah3QIyo096O2OSNXVnWzFHXw5M1SBBkDGuA1js-UtyYfJgmG8bj_FEaozqIpR5zrnNsLT"/>
</div>
<p class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest text-center">
                Book your call with Chris Sembroski
            </p>
</div>
</header>
<!-- Progress Indicator -->
<div class="w-full flex flex-col items-center justify-center py-md px-md">
<div class="flex items-center gap-sm">
<span class="font-label-md text-[10px] uppercase tracking-widest text-on-surface-variant mr-2">PROGRESS</span>
<div class="progress-dash filled"></div>
<div class="progress-dash filled"></div>
<div class="progress-dash"></div>
</div>
</div>
<!-- Main Content -->
<main class="flex-1 w-full px-md md:px-lg flex flex-col gap-lg pb-32">
<div class="flex flex-col gap-xs text-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background">What do you want to cover?</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Chris uses this to prepare for your 45-minute session.</p>
</div>
<form class="flex flex-col gap-md mt-md w-full max-w-2xl mx-auto">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest" for="goals">GOALS &amp; QUESTIONS</label>
<textarea class="custom-input rounded-lg p-sm font-body-md text-body-md resize-none w-full" id="goals" placeholder="e.g. Review our comms architecture for a lunar relay mission…" rows="4"></textarea>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest" for="background">YOUR BACKGROUND</label>
<textarea class="custom-input rounded-lg p-sm font-body-md text-body-md resize-none w-full" id="background" placeholder="Role, organization, and what you have already tried…" rows="4"></textarea>
</div>
<div class="flex items-start gap-xs text-on-surface-variant mt-xs">
<span class="material-symbols-outlined text-[16px]">info</span>
<p class="font-body-md text-[13px]">At least 10 characters each — feeds your pre-call briefing.</p>
</div>
</form>
</main>
<!-- Footer Actions -->
<div class="fixed bottom-0 w-full max-w-[780px] bg-gradient-to-t from-[#1c1c1c] via-[#1c1c1c] to-transparent pt-xl pb-lg px-md md:px-lg z-20 flex flex-col items-center gap-sm">
<button class="w-full max-w-md bg-white text-[#1c1c1c] font-label-md text-[14px] uppercase tracking-widest py-4 rounded-full hover:bg-gray-200 transition-colors active:scale-95">
            Continue to Payment
        </button>
<button class="font-label-md text-[12px] uppercase tracking-widest text-on-surface-variant hover:text-white transition-colors">
            Back
        </button>
</div>
