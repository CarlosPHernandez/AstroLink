</div>
</header>
<main class="mt-[140px] w-full max-w-xl px-md py-lg flex flex-col gap-lg">
<!-- Progress HUD Area -->
<div class="flex flex-col items-center gap-md">
<div class="flex justify-center mb-xs">
<span class="text-[10px] font-label-md text-on-primary opacity-40 uppercase tracking-widest">Progress</span>
</div>
<div class="flex justify-center items-center gap-xs mb-md"><div class="w-8 h-1 bg-on-primary -skew-x-12 rounded-full"></div><div class="w-8 h-1 border border-on-primary/20 -skew-x-12 rounded-full"></div><div class="w-8 h-1 border border-on-primary/20 -skew-x-12 rounded-full"></div></div>
</div>
<!-- Main Content Section -->
<section class="border-top border-white/5 pt-lg">
<div class="w-full">
<div class="space-y-xs mb-lg">
<h1 class="font-headline-lg text-headline-lg text-on-primary">Create your account</h1>
<p class="text-body-lg text-on-primary-container opacity-70">Introduce yourself to Chris!</p>
</div>
<form class="flex flex-col gap-md">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-primary uppercase tracking-widest opacity-70" for="fullname">Full Name</label>
<input class="bg-[#111111] border-outline-variant/30 text-on-primary rounded-lg px-md py-sm focus:ring-on-tertiary-container focus:border-on-tertiary-container transition-all" id="fullname" placeholder="John Doe" type="text" value="John Doe">
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-primary uppercase tracking-widest opacity-70" for="email">Email Address</label>
<input class="bg-[#111111] border-outline-variant/30 text-on-primary rounded-lg px-md py-sm focus:ring-on-tertiary-container focus:border-on-tertiary-container transition-all" id="email" placeholder="commander@astrolink.com" type="email" value="commander@astrolink.com">
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-primary uppercase tracking-widest opacity-70" for="password">Password</label>
<input class="bg-[#111111] border-outline-variant/30 text-on-primary rounded-lg px-md py-sm focus:ring-on-tertiary-container focus:border-on-tertiary-container transition-all" id="password" placeholder="••••••••" type="password" value="••••••••">
<span class="text-[12px] text-on-primary-container opacity-50 italic mt-xs">Password must be at least 8 characters</span>
</div>
<div class="pt-lg flex flex-col gap-md">
<button class="w-full bg-on-primary text-primary font-bold py-sm rounded-lg transition-transform active:scale-[0.98] shadow-sm hover:opacity-90 text-body-lg tracking-tight" type="button">
                        Continue to Goals
                    </button>
<div class="text-center">
<a class="text-body-md hover:underline decoration-on-tertiary-container/30 underline-offset-4 transition-all text-on-primary opacity-80" href="#">
                            Already have an account? Sign in
                        </a>
</div>
</div>
</form>
</div>
</section>
</main>
<script>
    // Simple micro-interaction for input focus
    const inputs = document.querySelectorAll('input');
    inputs.forEach(input => {
        input.addEventListener('focus', () => {
            const label = input.parentElement.querySelector('label');
            label.classList.add('text-on-tertiary-container', 'opacity-100');
            label.classList.remove('opacity-70');
        });
        input.addEventListener('blur', () => {
            if (!input.value) {
                const label = input.parentElement.querySelector('label');
                label.classList.remove('text-on-tertiary-container', 'opacity-100');
                label.classList.add('opacity-70');
            }
        });
    });
</script>
